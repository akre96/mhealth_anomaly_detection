[project]
name = "mhealth_anomaly_detection"
version = "0.1.2"
description = ""
authors = [{ name = "Samir Akre", email = "samir.akre@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.6.2,<4",
    "scikit-learn>=1.1.3,<2",
    "ipykernel>=6.19.2,<7",
    "tqdm>=4.64.1,<5",
    "p-tqdm>=1.4.0,<2",
    "colour>=0.1.5,<0.2",
    "autopep8>=2.0.2,<3",
    "altair>=5.0.0,<6",
    "rpy2>=3.5.12,<4",
    "pingouin>=0.5.3,<0.6",
    "pandas>=2.1.1,<3",
]

[dependency-groups]
dev = [
    "pytest~=7.2",
    "flake8>=6.0.0,<7",
    "black>=23.1.0,<24",
    "hypothesis>=6.78.2,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 79
